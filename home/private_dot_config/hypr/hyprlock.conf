# Catppuccin Mocha
general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    color = rgb(1e1e2e)
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(cba6f7)
    inner_color = rgb(313244)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    placeholder_text = password
    position = 0, -40
    halign = center
    valign = center
}

label {
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
