{{- /* chezmoi:modify-template */ -}}
{{- /* btop rewrites btop.conf on exit, so only its color_theme line is owned
       here. On Omarchy it stays "current", which follows the Omarchy theme. */ -}}
{{- if stat "/usr/share/omarchy" -}}
{{ .chezmoi.stdin }}
{{- else if regexMatch `(?m)^color_theme = ` .chezmoi.stdin -}}
{{ .chezmoi.stdin | replaceAllRegex `(?m)^color_theme = .*$` `color_theme = "catppuccin_macchiato"` }}
{{- else -}}
{{ .chezmoi.stdin }}color_theme = "catppuccin_macchiato"
{{ end -}}
