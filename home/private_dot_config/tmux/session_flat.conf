# Session module with its own name, so tpm re-sourcing the stock ones at the end
# does not overwrite it. Sourced from tmux.conf with the separators swapped.
%hidden MODULE_NAME="session_flat"

set -g @catppuccin_session_flat_icon " "
set -g @catppuccin_session_flat_color "#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}"
set -g @catppuccin_session_flat_text " #S"

source -F "#{d:current_file}/plugins/tmux/utils/status_module.conf"
