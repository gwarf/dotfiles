---
# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
name: MegaLinter

on:
  # Trigger mega-linter at every push. Action will also be visible from Pull Requests to main
  push:
  pull_request:
    branches: [main]

permissions: read-all

env:
  # Apply linter fixes configuration
  # When active, APPLY_FIXES must also be defined as environment variable
  # (in github/workflows/mega-linter.yml or other CI tool)
  APPLY_FIXES: all
  APPLY_FIXES_EVENT: pull_request
  # If APPLY_FIXES is used, defines if the fixes are directly committed (commit) or posted in a PR (pull_request)
  APPLY_FIXES_MODE: pull_request

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push, comment issues & post new PR
      # Remove the ones you do not need
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          # If you use VALIDATE_ALL_CODEBASE = true, you can remove this line to improve performances
          fetch-depth: 0
          # Do not leave the token in .git/config for later steps to pick up.
          # Both fix-applying steps below authenticate on their own, so nothing
          # here needs it. If APPLY_FIXES_MODE is ever switched back to
          # "commit", git-auto-commit-action does rely on persisted
          # credentials and this must be revisited.
          persist-credentials: false

      # MegaLinter
      - name: MegaLinter
        id: ml
        # You can override MegaLinter flavor used to have faster performances
        # More info at https://megalinter.io/flavors/
        uses: oxsecurity/megalinter/flavors/documentation@15e5b45552097e318c93de385779ce3b1084052c # v10.0.0
        env:
          # All available variables are described in documentation
          # https://megalinter.io/configuration/
          # Validates all source when push on main, else just the git diff with main.
          # Override with true if you always want to lint all sources
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          FILTER_REGEX_EXCLUDE: (deprecated/)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ADD YOUR CUSTOM ENV VARIABLES HERE OR DEFINE THEM IN A FILE .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY
          DISABLE: COPYPASTE
          DISABLE_LINTERS: REPOSITORY_GRYPE,REPOSITORY_TRIVY,REPOSITORY_TRUFFLEHOG,SPELL_CSPELL,CSS_STYLELINT,BASH_EXEC
          # Secret scanning is deliberately not PR-scoped. v10 replaced
          # gitleaks with betterleaks, and REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN
          # puts betterleaks in git mode, where it aborts on "dubious ownership"
          # of /github/workspace; a safe.directory PRE_COMMANDS does not fix it.
          # So betterleaks scans the whole workspace on every PR. Do not
          # reintroduce REPOSITORY_GITLEAKS_PR_COMMITS_SCAN: v10 ignores it.
          # zizmor needs the token for its online audits (ref-confusion,
          # known-vulnerable-actions); MegaLinter strips it from linter
          # subprocesses unless it is explicitly whitelisted.
          ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES: GITHUB_TOKEN
          # msmtpq and msmtp-queue are vendored upstream (msmtpq suite,
          # Chris Gianniotis, GPLv3) - not ours to reformat or patch.
          BASH_SHELLCHECK_FILTER_REGEX_EXCLUDE: (home/private_dot_local/bin/executable_msmtp(q|-queue))
          # Every script in home/private_dot_local/bin/ is extension-less, and the
          # BASH descriptor ships file_extensions [.sh .bash .dash .ksh] with no ""
          # entry. filter_files() drops a file at the extension gate before it ever
          # reaches file_contains_regex, so the shebang match never runs and none of
          # these were linted. Adding "" makes them candidates; the descriptor's
          # shebang regexes then select the shell ones.
          BASH_SHELLCHECK_FILE_EXTENSIONS: '["", ".sh", ".bash", ".dash", ".ksh"]'

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log

      # Create pull request if applicable (for now works only on PR from same repository, not from forks)
      - name: Create Pull Request with applied fixes
        id: cpr
        if: steps.ml.outputs.has_updated_sources == 1 &&
          (env.APPLY_FIXES_EVENT == 'all' || env.APPLY_FIXES_EVENT ==
          github.event_name) && env.APPLY_FIXES_MODE == 'pull_request' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
          !contains(github.event.head_commit.message, 'skip fix')
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          commit-message: "[MegaLinter] Apply linters automatic fixes"
          title: "[MegaLinter] Apply linters automatic fixes"
          labels: bot
      - name: Create PR output
        if: steps.ml.outputs.has_updated_sources == 1 &&
          (env.APPLY_FIXES_EVENT == 'all' || env.APPLY_FIXES_EVENT ==
          github.event_name) && env.APPLY_FIXES_MODE == 'pull_request' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
          !contains(github.event.head_commit.message, 'skip fix')
        # Pass step outputs through the environment rather than expanding them
        # into the shell source, so they cannot be parsed as code.
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          echo "Pull Request Number - $PR_NUMBER"
          echo "Pull Request URL - $PR_URL"

      # Push new commit if applicable (for now works only on PR from same repository, not from forks)
      - name: Prepare commit
        if: steps.ml.outputs.has_updated_sources == 1 &&
          (env.APPLY_FIXES_EVENT == 'all' || env.APPLY_FIXES_EVENT ==
          github.event_name) && env.APPLY_FIXES_MODE == 'commit' && github.ref
          != 'refs/heads/main' && (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
          !contains(github.event.head_commit.message, 'skip fix')
        run: sudo chown -Rc $UID .git/
      - name: Commit and push applied linter fixes
        if: steps.ml.outputs.has_updated_sources == 1 &&
          (env.APPLY_FIXES_EVENT == 'all' || env.APPLY_FIXES_EVENT ==
          github.event_name) && env.APPLY_FIXES_MODE == 'commit' && github.ref
          != 'refs/heads/main' && (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
          !contains(github.event.head_commit.message, 'skip fix')
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit_message: "[MegaLinter] Apply linters fixes"
          commit_user_name: gwarf
          commit_user_email: baptiste@bapt.name
